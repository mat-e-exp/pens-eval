<!DOCTYPE html>
<html>
<head>
    <title>Test</title>
</head>
<body>
    <h1>Testing Data Load</h1>
    <div id="output"></div>
    <script>
        console.log('Script loaded');

        fetch('data/account-summary.csv')
            .then(response => {
                console.log('Response:', response);
                return response.text();
            })
            .then(text => {
                console.log('CSV loaded, first 500 chars:', text.substring(0, 500));
                document.getElementById('output').innerHTML = '<pre>' + text.substring(0, 1000) + '</pre>';
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('output').innerHTML = 'Error: ' + error;
            });
    </script>
</body>
</html>

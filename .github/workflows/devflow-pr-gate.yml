# Generated by devflow — do not edit manually
name: devflow PR Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-size:
    name: PR size check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check PR size
        run: |
          LINES=$(git diff --stat origin/main...HEAD | tail -1 | grep -oP '\d+(?= insertion)' || echo 0)
          DELETIONS=$(git diff --stat origin/main...HEAD | tail -1 | grep -oP '\d+(?= deletion)' || echo 0)
          TOTAL=$((LINES + DELETIONS))
          MAX=400
          if [ "$TOTAL" -gt "$MAX" ]; then
            echo "::error::PR exceeds 400 LOC limit ($TOTAL lines changed)"
            exit 1
          fi
          echo "PR size: $TOTAL lines (limit: $MAX)"

  branch-naming:
    name: Branch naming convention
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ ! "$BRANCH" =~ ^(feature\/|hotfix\/|deps\/|experiment\/). ]]; then
            echo "::error::Branch name '$BRANCH' does not match required prefixes"
            exit 1
          fi
          echo "Branch name '$BRANCH' is valid"

# Generated by devflow — do not edit manually
name: devflow Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  trivy-secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy
      - name: Run Secrets scan
        run: trivy fs --scanners secret --secret-config .devflow/rules/trivy-secret.yaml --skip-dirs '**/.devflow/engine' --skip-files '**/trivy-secret.yaml' --skip-files '**/dangerous-config.yaml' --exit-code 1 .

  trivy-cve:
    name: CVE scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy
      - name: Run CVE scan
        run: trivy fs --scanners vuln --severity CRITICAL,HIGH --exit-code 1 .

  semgrep:
    name: Semgrep security scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Semgrep
        run: pip install semgrep
      - name: Run Semgrep security scan
        run: semgrep scan --config auto --error

  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  suppression-gate:
    name: Suppression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Suppression gate
        run: node .devflow/engine/cli/index.js check --gate suppression-gate

  dangerous-config:
    name: Dangerous configuration scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Semgrep
        run: pip install semgrep
      - name: Run Dangerous configuration scan
        run: git ls-files -z -- ':!.devflow' | xargs -0 -r semgrep scan --config .devflow/rules/dangerous-config.yaml --error --metrics=off --quiet --disable-version-check --json

  lockfile-gate:
    name: Lockfile gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Lockfile gate
        run: node .devflow/engine/cli/index.js check --gate lockfile-gate

  security:
    name: python security scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Bandit
        run: pip install bandit
      - name: Run python security scan
        run: bandit . hooks/

  security-javascript:
    name: javascript security scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install ESLint
        run: npm install -g eslint
      - name: Run javascript security scan
        run: eslint --no-error-on-unmatched-pattern .

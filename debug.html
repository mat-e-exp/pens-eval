<!DOCTYPE html>
<html>
<head>
    <title>Debug CSV Parsing</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .success { color: green; }
        .error { color: red; }
        table { border-collapse: collapse; margin-top: 20px; }
        td, th { border: 1px solid #ddd; padding: 8px; }
    </style>
</head>
<body>
    <h1>Debug CSV Parsing</h1>
    <div id="output"></div>
    <table id="dataTable"></table>

    <script>
        const output = document.getElementById('output');
        const table = document.getElementById('dataTable');

        function log(msg, isError = false) {
            const div = document.createElement('div');
            div.className = isError ? 'error' : 'success';
            div.textContent = msg;
            output.appendChild(div);
            console.log(msg);
        }

        fetch('data/account-summary.csv')
            .then(response => response.text())
            .then(csvText => {
                log('✓ CSV loaded, length: ' + csvText.length);

                const lines = csvText.split('\n');
                log('✓ Total lines: ' + lines.length);

                let headerFound = false;
                let dataRows = [];

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];

                    // Look for the header
                    if (line.includes('Stock,Units held,Price')) {
                        headerFound = true;
                        log('✓ Header found at line ' + i + ': ' + line.substring(0, 50) + '...');
                        continue;
                    }

                    // Parse data rows
                    if (headerFound && line.trim() &&
                        !line.includes('Totals') &&
                        !line.includes('Shares are valued') &&
                        line.includes('"')) {

                        // Parse the CSV line with quotes
                        const matches = line.match(/"([^"]*)"|([^,]+)/g);
                        if (matches) {
                            const columns = matches.map(col => col.replace(/"/g, '').trim());

                            if (columns.length >= 7) {
                                // Parse the actual values
                                const stockName = columns[0];
                                const value = columns[3].replace(/[^0-9.,\-]/g, '').replace(',', '');

                                dataRows.push({
                                    name: stockName,
                                    value: parseFloat(value),
                                    raw: columns
                                });

                                if (dataRows.length <= 3) {
                                    log('✓ Parsed stock: ' + stockName + ' = £' + value);
                                }
                            }
                        }
                    }
                }

                log('✓ Total stocks parsed: ' + dataRows.length);

                // Display in table
                if (dataRows.length > 0) {
                    let html = '<thead><tr><th>Stock</th><th>Value</th><th>Raw Data</th></tr></thead><tbody>';
                    dataRows.slice(0, 10).forEach(row => {
                        html += `<tr>
                            <td>${row.name}</td>
                            <td>£${row.value.toFixed(2)}</td>
                            <td>${row.raw.slice(0, 5).join(' | ')}</td>
                        </tr>`;
                    });
                    html += '</tbody>';
                    table.innerHTML = html;
                } else {
                    log('✗ No data rows found!', true);
                }
            })
            .catch(error => {
                log('✗ Error: ' + error, true);
            });
    </script>
</body>
</html>

# Custom Trivy secret detection rules
# Supplements Trivy's built-in 88 rules with patterns it misses
#
# Format: https://trivy.dev/docs/scanner/secret/#custom-rules

rules:
  - id: discord-webhook-url
    category: general
    title: Discord Webhook URL
    severity: HIGH
    keywords:
      - discord
      - webhook
    regex: "https://discord(?:app)?\\.com/api/webhooks/[0-9]+/[A-Za-z0-9_-]+"

  - id: slack-webhook-url
    category: general
    title: Slack Webhook URL
    severity: HIGH
    keywords:
      - slack
      - webhook
    regex: "https://hooks\\.slack\\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[A-Za-z0-9]+"

  - id: generic-webhook-url
    category: general
    title: Generic Webhook URL with token
    severity: MEDIUM
    keywords:
      - webhook
    regex: "https?://[^\\s\"']+/webhooks?/[^\\s\"']{20,}"

allow-rules:
  - id: allow-example-urls
    description: Ignore example/placeholder webhook URLs
    regex: "https?://example\\.com|https?://localhost|YOUR_WEBHOOK"

